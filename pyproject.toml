[project]
name = "proyecto-rcp-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.2.4",
    "data>=0.4",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.90",
    "pillow>=12.1.0",
    "pycocotools>=2.0.11",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "ultralytics>=8.4.6",
    "utils>=1.0.2",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
